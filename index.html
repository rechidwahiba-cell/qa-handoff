<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site QA Handoff | Wahiba Rechid</title>
<meta name="description" content="Test a delivered website page by page and send clear, complete feedback to developers: a guided test plan, well-formed issue reports and a retest loop, with no ticketing tool.">
<meta property="og:title" content="Site QA Handoff">
<meta property="og:description" content="From marketing to tech: test a delivered site and report issues developers can fix without asking twice.">
<style>
:root{
  --bg:#FBF8F2;--card:#fff;--ink:#18223A;--mute:#5C6478;--line:#E9E2D3;
  --gold:#C9A45C;--gold-soft:#E3CC9A;--hero:#0D182D;--navy:#14233F;
  --ok:#1F8A63;--warn:#B8791A;--bad:#C8412B;--info:#2B5C9E;
  --shadow:0 1px 2px rgba(20,35,63,.05),0 10px 28px -14px rgba(20,35,63,.2);
}
@media (prefers-color-scheme:dark){:root{--bg:#0B1322;--card:#132038;--ink:#F5EFE3;--mute:#A3ABBD;--line:#24324F;--navy:#1B2C4D;--ok:#5FCFA0;--warn:#E8B45C;--bad:#F08A76;--info:#7FA8E0;--shadow:0 12px 32px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden;padding:28px 0 0}
.hero:before{content:"";position:absolute;inset:-60% -10% auto auto;width:640px;height:640px;background:radial-gradient(closest-side,rgba(201,164,92,.3),transparent)}
.hero .wrap{position:relative}
.top{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--gold-soft)}
h1{font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.1;letter-spacing:-.025em;margin:6px 0 8px;font-weight:800}
.hero p{max-width:600px;margin:0;color:rgba(255,255,255,.78)}
.side{display:grid;gap:8px;justify-items:start}
@media(min-width:760px){.side{justify-items:end}}
.hbtn{font:inherit;font-size:.85rem;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
.hbtn[aria-pressed=true]{background:var(--gold-soft);color:#14233F;border-color:var(--gold-soft)}
#saved{color:rgba(255,255,255,.65);font-size:.78rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp{margin-left:auto}
nav.tabs{display:flex;gap:4px;margin-top:22px;overflow-x:auto}
.tabb{font:inherit;font-weight:600;font-size:.95rem;padding:11px 16px;border:0;border-radius:12px 12px 0 0;background:rgba(255,255,255,.08);color:rgba(255,255,255,.8);cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tabb small{font-size:.74rem;font-weight:700;padding:1px 7px;border-radius:99px;background:rgba(255,255,255,.16)}
.tabb[aria-current=true]{background:var(--bg);color:var(--ink)}
.tabb[aria-current=true] small{background:var(--line)}
main{padding-top:24px}
h2{font-size:1.4rem;letter-spacing:-.02em;margin:0 0 4px}
.lead{color:var(--mute);margin:0 0 16px;max-width:720px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;display:grid;gap:12px}
.card>h3{margin:0;font-size:1.05rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fld{display:grid;gap:4px;min-width:0}
.lab{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
input[type=text],textarea,select{font:inherit;font-size:.94rem;padding:8px 11px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;display:block}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid rgba(201,164,92,.7);outline-offset:1px}
.btn{font:inherit;font-weight:600;font-size:.9rem;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.main{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:linear-gradient(135deg,#E3CC9A,#C9A45C);color:#14233F;border-color:transparent;font-weight:700}
.btn.x{padding:6px 10px;color:var(--mute)}
.why{color:var(--mute);font-size:.93rem;margin:0}
.note{padding:11px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 13%,var(--card));border:1px solid color-mix(in srgb,var(--gold) 45%,var(--card));font-size:.92rem}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th{text-align:left;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:4px 6px}
table.t td{padding:4px 6px;vertical-align:top}
.tw{overflow-x:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-weight:600;font-size:.88rem;padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip small{font-weight:700;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}.chip[aria-pressed=true] small{color:var(--gold-soft)}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:inline-flex;gap:6px;align-items:center;padding:6px 11px;border:1.5px solid var(--line);border-radius:99px;font-size:.88rem;font-weight:600;cursor:pointer;background:var(--bg)}
.chk input{accent-color:var(--navy)}
.tag{font-style:normal;font-size:.64rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--t,var(--gold)) 20%,var(--card));color:var(--ink)}
.t-block{--t:#c8412b}.t-major{--t:#d98a00}.t-minor{--t:#2B5C9E}.t-idea{--t:#7b7a94}
.t-open{--t:#c8412b}.t-reopened{--t:#c8412b}.t-fixed{--t:#d98a00}.t-verified{--t:#1F8A63}.t-wontfix{--t:#7b7a94}
.cat{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.cat:first-of-type{border-top:0;padding-top:0}
.cat h4{margin:0 0 2px;font-size:.95rem;display:flex;gap:8px;align-items:center}
.cat h4 small{color:var(--mute);font-weight:600}
.test{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:5px 0}
.test span{font-size:.94rem}
.test .lk{font:inherit;font-size:.8rem;font-weight:700;color:var(--bad);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0;margin-left:8px}
.res{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.res button{font:inherit;font-size:.8rem;font-weight:700;padding:6px 11px;border:0;border-left:1.5px solid var(--line);background:var(--bg);color:var(--mute);cursor:pointer}
.res button:first-child{border-left:0}
.res button[aria-pressed=true].pass{background:var(--ok);color:#fff}
.res button[aria-pressed=true].fail{background:var(--bad);color:#fff}
.res button[aria-pressed=true].na{background:var(--mute);color:#fff}
.iss{border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.ih{font:inherit;width:100%;text-align:left;background:none;border:0;color:var(--ink);cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.ih b{font-size:.98rem}.ih small{display:block;color:var(--mute);font-size:.82rem;font-weight:500}
.ih .id{font-weight:800;color:var(--mute);font-size:.85rem}
.ib{padding:4px 14px 16px;display:grid;gap:12px;border-top:1px solid var(--line)}
.ro{display:grid;gap:8px;font-size:.93rem}
.ro div{display:grid;grid-template-columns:110px 1fr;gap:10px}
.ro b{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.ro span{white-space:pre-wrap;word-break:break-word}
.miss{font-size:.85rem;color:var(--bad);font-weight:600}
.okk{font-size:.85rem;color:var(--ok);font-weight:600}
.verdict{border-radius:16px;padding:18px 20px;color:#fff;background:var(--v);display:grid;gap:4px}
.verdict small{font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem;opacity:.9}
.verdict b{font-size:1.35rem;line-height:1.2}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:1.6rem;line-height:1.1}.kpi span{color:var(--mute);font-size:.82rem}
.box{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.box header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.box header button{font:inherit;font-size:.8rem;font-weight:700;text-transform:none;letter-spacing:0;padding:5px 11px;border-radius:99px;border:0;background:var(--navy);color:#fff;cursor:pointer}
.box pre{margin:0;padding:12px;font:inherit;font-size:.92rem;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
footer{margin:40px 0 32px;text-align:center;color:var(--mute);font-size:.86rem}
footer a{color:inherit;font-weight:600}
@media(max-width:560px){.test{grid-template-columns:1fr}.ro div{grid-template-columns:1fr;gap:0}.card{padding:14px}.ih{grid-template-columns:auto 1fr}.ih .tags{grid-column:1/-1}}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="top">
    <div>
      <span class="eyebrow">Site QA handoff</span>
      <h1>Test the delivery. Report it once.</h1>
      <p>A guided test plan for every page, and issue reports a developer can fix without asking you twice. No ticketing tool needed.</p>
    </div>
    <div class="side">
      <div class="row" role="group" aria-label="Your role"><button type="button" class="hbtn" id="rTest">I am testing</button><button type="button" class="hbtn" id="rFix">I am fixing</button></div>
      <div class="row"><button type="button" class="hbtn" id="saveF">Save to a file</button><button type="button" class="hbtn" id="openF">Open a file</button><input type="file" id="file" accept=".json,application/json" hidden></div>
      <small id="saved">Saved in this browser as you work</small>
    </div>
  </div>
  <nav class="tabs" id="nav" aria-label="Sections"></nav>
</div></header>

<main class="wrap" id="main"></main>

<footer><div class="wrap">Everything you type stays in your browser. Built by <a href="https://wahiba-rechid.vercel.app/">Wahiba Rechid</a></div></footer>

<script>
const $=id=>document.getElementById(id);
const h=(tag,props,...kids)=>{const e=document.createElement(tag);for(const k in props||{}){const v=props[k];if(k.startsWith("aria-")&&v!=null){e.setAttribute(k,String(v));continue}if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}kids.flat(3).forEach(c=>c!=null&&c!==false&&e.appendChild(typeof c==="string"?document.createTextNode(c):c));return e};
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const stamp=()=>new Date().toISOString().slice(0,10);
const slug=t=>String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);

// ---------- test plan ----------
const CATS=[
 ["content","Content and spelling",[["c1","The text matches the approved content"],["c2","No spelling or grammar mistakes"],["c3","No placeholder text or test content left"],["c4","Names, prices, dates and numbers are correct"]]],
 ["design","Design and layout",[["d1","Spacing and alignment match the mockup"],["d2","Fonts, sizes and colours match the mockup"],["d3","Images are sharp, not stretched, and the right ones"],["d4","No text is cut off or overlapping"]]],
 ["mobile","Mobile and responsive",[["m1","Readable on a phone without zooming or scrolling sideways"],["m2","The menu opens and works on a phone"],["m3","Buttons and links are easy to tap"],["m4","The layout holds on a tablet and on a small laptop"]]],
 ["links","Links and buttons",[["l1","Every button leads to the right place"],["l2","No link leads to an error page"],["l3","External links open the right site"]]],
 ["forms","Forms",[["f1","Required fields and error messages work"],["f2","The form can be sent and a confirmation appears"],["f3","The message or lead arrives where it should"]]],
 ["seo","SEO",[["s1","The page title is the one specified"],["s2","The meta description is the one specified"],["s3","One main heading (H1) and a logical heading order"],["s4","Images have a description (alt text)"],["s5","The address of the page is the one specified"]]],
 ["tech","Errors and speed",[["t1","The page loads quickly"],["t2","No error message, blank area or broken element"],["t3","It works in a second browser"]]]
];
const SITE=["site","Whole site",[["g1","An address that does not exist shows a helpful 404 page"],["g2","The sitemap lists the right pages"],["g3","The live site is not hidden from search engines (no noindex)"],["g4","The site icon and site name appear in the browser tab"],["g5","http and non-www addresses redirect to the main one"],["g6","Header, footer and menu links all work"],["g7","The cookie banner appears and choices are respected"],["g8","Visits and key actions are recorded in the analytics tool"]]];
const CATN=Object.fromEntries([...CATS,SITE].map(c=>[c[0],c[1]]));CATN.other="Other";
const SEV={block:"Blocking",major:"Major",minor:"Minor",idea:"Suggestion"};
const SEVH={block:"prevents going live",major:"visible to every visitor",minor:"small defect",idea:"improvement, not a defect"};
const STA={open:"Open",fixed:"Fixed, to retest",verified:"Verified",reopened:"Reopened",wontfix:"Will not fix"};
const DEV=["Desktop, Chrome","Desktop, Safari","Desktop, Firefox","Desktop, Edge","iPhone, Safari","Android phone, Chrome","Tablet"];

// ---------- state ----------
const EXAMPLE=()=>({example:true,role:"test",proj:{name:"Atelier Nour",url:"staging.ateliernour.com",round:"Delivery 1",tester:"",contact:""},devices:["Desktop, Chrome","iPhone, Safari"],
 pages:[{id:1,name:"Home",path:"/"},{id:2,name:"Workshops",path:"/workshops"},{id:3,name:"Contact",path:"/contact"}],
 tests:{"1:c1":"pass","1:c2":"fail","1:c3":"pass","1:d1":"pass","1:m1":"fail","1:l1":"pass","3:f2":"fail","1:s1":"pass","site:g1":"pass"},
 issues:[
  {id:1,title:"Typo in the main heading",page:"1",section:"Hero, main heading",cat:"content",sev:"minor",device:"Desktop, Chrome",steps:"Open the home page.",expected:"\"Handmade ceramic workshops\"",actual:"The heading reads \"Handmade cermaic workshops\".",status:"fixed",dev:"Corrected in the content file.",created:"2026-11-18",rounds:"0",test:"1:c2"},
  {id:2,title:"Text overflows the screen on a phone",page:"1",section:"Pricing table",cat:"mobile",sev:"major",device:"iPhone, Safari",steps:"1. Open the home page on a phone.\n2. Scroll to the pricing table.",expected:"The table fits the width of the screen.",actual:"The third column is cut off and the page scrolls sideways.",status:"open",dev:"",created:"2026-11-18",rounds:"0",test:"1:m1"},
  {id:3,title:"Contact form shows no confirmation",page:"3",section:"Contact form",cat:"forms",sev:"block",device:"Desktop, Chrome",steps:"1. Fill in every field.\n2. Click Send.",expected:"A confirmation message, and the email arrives in the shared inbox.",actual:"Nothing happens after the click. No email received.",status:"open",dev:"",created:"2026-11-19",rounds:"0",test:"3:f2"}]});
const BLANK=()=>({role:"test",proj:{name:"",url:"",round:"Delivery 1",tester:"",contact:""},devices:["Desktop, Chrome","iPhone, Safari"],pages:[{id:1,name:"Home",path:"/"}],tests:{},issues:[]});
const strs=o=>Object.fromEntries(Object.entries(o&&typeof o==="object"?o:{}).filter(([k,v])=>typeof v==="string"));
function normalize(o){const b=BLANK();o=o&&typeof o==="object"?o:{};
  const pages=(Array.isArray(o.pages)?o.pages:[]).filter(p=>p&&typeof p==="object").slice(0,200).map((p,i)=>({id:Number(p.id)>0?Number(p.id):i+1,name:String(p.name||""),path:String(p.path||"")}));
  const tests=Object.fromEntries(Object.entries(o.tests&&typeof o.tests==="object"?o.tests:{}).filter(([k,v])=>["pass","fail","na"].includes(v)));
  const issues=(Array.isArray(o.issues)?o.issues:[]).filter(i=>i&&typeof i==="object").slice(0,2000).map((i,n)=>({...strs(i),id:Number(i.id)>0?Number(i.id):n+1,sev:SEV[i.sev]?i.sev:"minor",status:STA[i.status]?i.status:"open",cat:CATN[i.cat]?i.cat:"other",page:String(i.page||"site")}));
  return{example:o.example===true,role:o.role==="fix"?"fix":"test",proj:{...b.proj,...strs(o.proj)},devices:(Array.isArray(o.devices)?o.devices:b.devices).filter(d=>typeof d==="string").slice(0,20),pages:pages.length?pages:b.pages,tests,issues}}
let S=normalize(store.get("qa-state",null)||EXAMPLE());
let sec="plan",cur=S.pages[0].id,flt="todo",live=[];
const open=new Set();
const save=()=>store.set("qa-state",S);
const dirty=()=>{S.example=false;save()};

// ---------- data helpers ----------
const N=()=>(S.proj.name||"").trim()||"the site";
const U=()=>{let u=((S.proj.url||"").trim()||"staging.yoursite.com").replace(/\s+/g,"").replace(/\/+$/,"");if(!/^https?:\/\//i.test(u))u="https://"+u;return u};
const pg=id=>S.pages.find(p=>String(p.id)===String(id));
const pName=id=>id==="site"?"Whole site":(pg(id)?pg(id).name||"(unnamed)":"(removed page)");
const pUrl=id=>{const p=pg(id);if(!p)return U();const s=(p.path||"").trim();return /^https?:/.test(s)?s:U()+(s?(s.startsWith("/")?s:"/"+s):"")};
const allTests=()=>[...S.pages.flatMap(p=>CATS.flatMap(c=>c[2].map(t=>({key:p.id+":"+t[0],page:String(p.id),cat:c[0],label:t[1]})))),...SITE[2].map(t=>({key:"site:"+t[0],page:"site",cat:"site",label:t[1]}))];
const cov=list=>{const d=list.filter(t=>S.tests[t.key]).length;return list.length?Math.round(100*d/list.length):0};
const unresolved=i=>["open","reopened","fixed"].includes(i.status);
const missing=i=>[[i.title,"a title"],[i.section,"the section of the page"],[i.expected,"what you expected"],[i.actual,"what happens"]].filter(x=>!(x[0]||"").trim()).map(x=>x[1]);
const sevRank={block:0,major:1,minor:2,idea:3};
const sorted=l=>[...l].sort((a,b)=>sevRank[a.sev]-sevRank[b.sev]||a.id-b.id);
function verdict(){const u=S.issues.filter(unresolved),b=u.filter(i=>i.sev==="block").length,m=u.filter(i=>i.sev==="major").length,c=cov(allTests()),rt=u.filter(i=>i.status==="fixed").length;
  if(b)return["var(--bad)","Not ready to go live",b+" blocking "+(b===1?"issue":"issues")+" still open."];
  if(c<80)return["var(--warn)","Not enough tested yet","Only "+c+"% of the test plan has a result. Aim for at least 80%."];
  if(m)return["var(--warn)","Ready with reservations",m+" major "+(m===1?"issue":"issues")+" still open. Decide together whether they can wait."];
  if(rt)return["var(--warn)","Almost there",rt+" "+(rt===1?"fix":"fixes")+" still to retest."];
  return["var(--ok)","Ready to go live","No blocking or major issue open, and "+c+"% of the plan tested."]}
function issueText(i){return "#"+i.id+" ["+SEV[i.sev]+"] "+pName(i.page)+((i.section||"").trim()?" > "+i.section.trim():"")+": "+((i.title||"").trim()||"(no title)")+"\nAddress: "+pUrl(i.page)+"\nCategory: "+CATN[i.cat]+((i.device||"").trim()?"\nDevice: "+i.device:"")+((i.steps||"").trim()?"\nSteps:\n"+i.steps.trim():"")+"\nExpected: "+((i.expected||"").trim()||"(to complete)")+"\nActual: "+((i.actual||"").trim()||"(to complete)")+"\nStatus: "+STA[i.status]+((i.dev||"").trim()?"\nDeveloper note: "+i.dev.trim():"")}
function message(){const u=sorted(S.issues.filter(unresolved)),v=verdict(),rt=u.filter(i=>i.status==="fixed");
  if(S.role==="fix")return "Hello,\n\n"+S.proj.round+" of "+N()+": "+rt.length+" "+(rt.length===1?"issue is":"issues are")+" fixed and ready for you to retest"+(S.issues.some(i=>i.status==="wontfix")?", and "+S.issues.filter(i=>i.status==="wontfix").length+" will not be fixed (reason in the note)":"")+".\n\n"+rt.map(i=>"- #"+i.id+" "+i.title+((i.dev||"").trim()?" ("+i.dev.trim()+")":"")).join("\n")+"\n\nThe file is attached: open it in the tool to retest and mark each one Verified or Reopened.\n"+location.origin+location.pathname+"\n\nThank you";
  return "Hello,\n\nHere is the test report for "+N()+" ("+U()+"), "+S.proj.round+".\n\nVerdict: "+v[1]+". "+v[2]+"\n"+cov(allTests())+"% of the test plan covered on "+S.pages.length+" pages, tested on "+S.devices.join(" and ")+".\n\n"+u.length+" "+(u.length===1?"issue":"issues")+" to handle, most serious first:\n"+u.slice(0,12).map(i=>"- #"+i.id+" ["+SEV[i.sev]+"] "+pName(i.page)+": "+i.title).join("\n")+(u.length>12?"\n- and "+(u.length-12)+" more in the file":"")+"\n\nEach issue has the page address, the section, the steps, what was expected and what happens. The Excel file and the review file are attached: you can open the review file in the tool, mark each issue Fixed with a note, and send it back for retest.\n"+location.origin+location.pathname+"\n\nThank you"}
